<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Canvas Shooting Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 16px 0;
      background: #121218;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: black;
      border: 2px solid #2d3142;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .controls {
      margin-top: 12px;
      font-size: 14px;
      color: #aab;
      text-align: center;
    }
    .key-badge {
      display: inline-block;
      padding: 2px 7px;
      background: #252836;
      border: 1px solid #444a61;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <canvas id="game" width="500" height="600"></canvas>
  <div class="controls">
    <span class="key-badge">↑ ↓ ← →</span> 或 <span class="key-badge">W A S D</span> 四向移動 ｜ <span class="key-badge">Space</span> （可按住）連發射擊
  </div>

  <!-- 載入遊戲邏輯 -->
  <script src="game.js"></script>
</body>
</html>
